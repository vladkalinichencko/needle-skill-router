[project]
name = "needle-router"
version = "0.1.0"
description = "Tiny Needle model that routes agent prompts to skills, instead of loading every skill description into the main context"
requires-python = ">=3.11"
dependencies = [
    "cactus-needle",
    "pyyaml",
]

[project.optional-dependencies]
train = ["cactus-needle[train]"]
metal = ["cactus-needle[train,metal]"]

[project.scripts]
nrouter = "needle_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/needle_router"]
